<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        if (typeof location === 'undefined' || location.protocol === 'file:') return;
        var path = location.pathname || '/';
        var href = '/';
        var indexMatch = path.match(/^(.*\/)index\.html$/i);
        if (indexMatch) {
          href = indexMatch[1] || '/';
        } else if (path === '/build' || path.indexOf('/build/') === 0) {
          href = '/build/';
        }
        var base = document.createElement('base');
        base.href = href;
        document.head.insertBefore(base, document.head.firstChild);

        var last = path.split('/').pop() || '';
        if (last && /\.[a-zA-Z0-9]+$/.test(last) && !/^index\.html$/i.test(last)) return;

        var isAppRoot = path === '/' || path === '' || /\/index\.html$/i.test(path) || path === '/build' || path === '/build/';
        if (!isAppRoot && !(location.hash && location.hash.length > 1)) {
          var hashPath = path + (location.search || '');
          if (hashPath.charAt(0) !== '/') hashPath = '/' + hashPath;
          location.replace(href.replace(/\/?$/, '/') + '#' + hashPath);
        }
      })();
    </script>
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="RFID API Dashboard"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>RFID API Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
