directories:
  output: release-online
  buildResources: build
extends: null
appId: com.loyalstring.sparkle-rfid-dashboard.online
productName: Sparkle RFID Dashboard Online
artifactName: ${productName}-${version}-Setup.${ext}
files:
  - filter:
      - build/**/*
      - electron/**/*
      - package.json
extraResources:
  - from: rfid-bridge/bin/Release/net8.0/win-x64/publish
    to: rfid-bridge
    filter:
      - '**/*'
  - from: build-resources/prerequisites
    to: prerequisites
    filter:
      - '**/*'
extraMetadata:
  main: electron/main.js
win:
  target: nsis
  icon: build-resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build-resources/icon.ico
  uninstallerIcon: build-resources/icon.ico
  installerHeaderIcon: build-resources/icon.ico
  shortcutName: Sparkle RFID (Online)
  include: build-resources/installer-rfid-prereqs.nsh
electronVersion: 41.7.1
